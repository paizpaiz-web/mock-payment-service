name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  DOCKER_IMAGE_NAME: mock-payment-service

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies (ECS)
      run: dotnet restore ./MockPaymentService

    - name: Build (ECS)
      run: dotnet build ./MockPaymentService --configuration Release --no-restore

    - name: Run tests (ECS)
      run: dotnet test ./MockPaymentService --configuration Release --no-build --verbosity normal

    - name: Restore dependencies (Lambda)
      run: dotnet restore ./MockPaymentServiceLambda/src/MockPaymentServiceLambda

    - name: Build (Lambda)
      run: dotnet build ./MockPaymentServiceLambda/src/MockPaymentServiceLambda --configuration Release --no-restore

    - name: Run tests (Lambda)
      run: dotnet test ./MockPaymentServiceLambda/test/MockPaymentServiceLambda.Tests/MockPaymentServiceLambda.Tests.csproj --configuration Release --verbosity normal

  deploy-ecs:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-lambda:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Validate required secrets
      run: |
        if [ -z "${{ secrets.RDS_ENDPOINT }}" ]; then echo "Error: RDS_ENDPOINT secret is not set"; exit 1; fi
        if [ -z "${{ secrets.RDS_DATABASE }}" ]; then echo "Error: RDS_DATABASE secret is not set"; exit 1; fi
        if [ -z "${{ secrets.RDS_USER }}" ]; then echo "Error: RDS_USER secret is not set"; exit 1; fi
        if [ -z "${{ secrets.RDS_PASSWORD }}" ]; then echo "Error: RDS_PASSWORD secret is not set"; exit 1; fi
        if [ -z "${{ secrets.JWT_KEY }}" ]; then echo "Error: JWT_KEY secret is not set"; exit 1; fi
        echo "All required secrets are set"

    - name: Restore dependencies
      run: dotnet restore ./MockPaymentServiceLambda/src/MockPaymentServiceLambda

    - name: Build Lambda function
      run: dotnet build ./MockPaymentServiceLambda/src/MockPaymentServiceLambda --configuration Release --no-restore

    - name: Publish Lambda function
      run: dotnet publish ./MockPaymentServiceLambda/src/MockPaymentServiceLambda --configuration Release --framework net8.0 --runtime linux-x64 --self-contained false -p:GenerateRuntimeConfigurationFiles=true

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: mock-payment-service-lambda
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build the Docker image
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

        # Push the Docker images
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

        # Export the image URI for use in CloudFormation
        echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

    - name: Deploy to AWS Lambda
      env:
        DB_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
        DB_NAME: ${{ secrets.RDS_DATABASE }}
        DB_USERNAME: ${{ secrets.RDS_USER }}
        DB_PASSWORD: ${{ secrets.RDS_PASSWORD }}
        JWT_KEY: ${{ secrets.JWT_KEY }}
        JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
        JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
      run: |
        echo "Debugging parameter values (passwords hidden):"
        echo "DB_ENDPOINT: $DB_ENDPOINT"
        echo "DB_NAME: $DB_NAME"
        echo "DB_USERNAME: $DB_USERNAME"
        echo "DB_PASSWORD: [SET - length: ${#DB_PASSWORD}]"
        echo "JWT_KEY: [SET - length: ${#JWT_KEY}]"
        echo "JWT_ISSUER: $JWT_ISSUER"
        echo "JWT_AUDIENCE: $JWT_AUDIENCE"
        echo "IMAGE_URI: $IMAGE_URI"

        # Deploy with CloudFormation
        aws cloudformation deploy \
          --template-file MockPaymentServiceLambda/src/MockPaymentServiceLambda/serverless.template \
          --stack-name MockPaymentServiceLambda \
          --parameter-overrides DbEndpoint=$DB_ENDPOINT DbName=$DB_NAME DbUsername=$DB_USERNAME DbPassword=$DB_PASSWORD JwtKey=$JWT_KEY JwtIssuer=$JWT_ISSUER JwtAudience=$JWT_AUDIENCE \
          --image-uri $IMAGE_URI \
          --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND
